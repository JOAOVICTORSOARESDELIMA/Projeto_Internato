# Conexão com o banco: lida de variáveis de ambiente, com valores padrão para
# desenvolvimento local. Não coloque senhas reais neste arquivo.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/internato}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Datas no formato ISO (2026-05-10T07:00:00) nas requisições e respostas
spring.jackson.serialization.write-dates-as-timestamps=false
